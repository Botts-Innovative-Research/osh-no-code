description = 'Protobuf Parser'
ext.details = ''

version = '1.0.1'
if (project.hasProperty("snapshot") && project.property("snapshot") == "true") {
    version = "${version}-SNAPSHOT"
}

// Disable tests
tasks.withType(Test).configureEach {
    enabled = false
}

// Disable test compilation, as it is breaking the build
sourceSets {
    test {
        java.srcDirs = []
        resources.srcDirs = []
    }
}

dependencies {
    implementation 'org.sensorhub:sensorhub-core:' + oshCoreVersion

    embeddedImpl "com.google.protobuf:protobuf-java:4.31.1"
    embeddedImpl "com.google.protobuf:protobuf-java-util:4.31.1"
    implementation project(':sensorhub-parser-utils')
    implementation project(':sensorhub-parser-json')
    testImplementation('junit:junit:4.13.1')
}

test {
    exclude '**/ProtobufTest.class'
    useJUnit()
}

osgi {
    manifest {
        attributes('Bundle-Vendor': 'Botts Innovative Research, Inc.')
        attributes('Bundle-Activator': 'com.botts.impl.parser.protobuf.Activator')
    }
}

ext.pom >>= {
    developers {
        developer {
            id 'earocorn'
            name 'Alex Almanza'
            organization 'Botts Innovative Research, Inc'
            organizationUrl 'https://www.botts-inc.com'
        }
    }
}
